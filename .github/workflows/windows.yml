name: Windows Server web

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutos que se mantiene abierto Windows (máx. 120)"
        required: false
        default: "60"
        type: string
      mode:
        description: "vnc (navegador) o anydesk"
        required: false
        default: "vnc"
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 125
    steps:
      - name: Instalar AnyDesk y abrir acceso
        if: inputs.mode == 'anydesk'
        shell: pwsh
        env:
          MINUTES: ${{ inputs.minutes }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $m = 60
          if ($env:MINUTES -match '^\d+$') { $m = [int]$env:MINUTES }
          if ($m -gt 120) { $m = 120 }
          if ($m -lt 1) { $m = 1 }

          $chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789'
          $pass = -join (1..12 | ForEach-Object { $chars[(Get-Random -Minimum 0 -Maximum $chars.Length)] })

          $dir = 'C:\AnyDesk'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest -Uri https://download.anydesk.com/AnyDesk.exe -OutFile "$dir\AnyDesk.exe"
          $exe = "$dir\AnyDesk.exe"
          Start-Process $exe -ArgumentList '--install C:\AnyDesk --start-with-win --silent' -Wait
          Start-Sleep -Seconds 8
          cmd /c "echo $pass | $exe --set-password"
          Start-Process $exe
          Start-Sleep -Seconds 10

          $id = ''
          for ($i = 0; $i -lt 20 -and -not ($id -match '^\d+$'); $i++) {
            $id = ((& $exe --get-id | Out-String)).Trim()
            if (-not ($id -match '^\d+$')) { Start-Sleep -Seconds 3 }
          }
          if (-not ($id -match '^\d+$')) { throw "No se pudo obtener el ID de AnyDesk" }

          Write-Host "::notice title=WINDOWS::ANYDESK_ID=$id PASS=$pass"
          $json = @{ type = 'anydesk'; id = $id; pass = $pass } | ConvertTo-Json -Compress
          $body = @{ message = 'sesion'; content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($json)) } | ConvertTo-Json
          Invoke-RestMethod -Method Put -Uri ('https://api.github.com/repos/' + $env:GITHUB_REPOSITORY + '/contents/session-' + $env:GITHUB_RUN_ID + '.json') -Headers @{ Authorization = ('Bearer ' + $env:GH_TOKEN); Accept = 'application/vnd.github+json' } -Body $body -ContentType 'application/json' | Out-Null
          Write-Host "AnyDesk abierto durante $m minutos. ID: $id  Contrasena: $pass"
          Start-Sleep -Seconds ($m * 60)

      - name: Instalar TightVNC (servidor VNC)
        if: inputs.mode != 'anydesk'
        id: vnc
        shell: pwsh
        run: |
          $chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789'
          $pass = -join (1..8 | ForEach-Object { $chars[(Get-Random -Minimum 0 -Maximum $chars.Length)] })
          choco install tightvnc -y --no-progress --install-arguments="'SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 SET_PASSWORD=1 VALUE_OF_PASSWORD=$pass SET_USECONTROLAUTHENTICATION=1 VALUE_OF_USECONTROLAUTHENTICATION=1 SET_CONTROLPASSWORD=1 VALUE_OF_CONTROLPASSWORD=$pass'"
          "pass=$pass" >> $env:GITHUB_OUTPUT
          Start-Sleep -Seconds 5
          $svc = Get-Service | Where-Object { $_.Name -like '*vnc*' }
          $svc | Format-Table -AutoSize
          foreach ($s in $svc) { if ($s.Status -ne 'Running') { Start-Service $s.Name -ErrorAction SilentlyContinue } }

          # Comprobar que el servidor VNC escucha de verdad en el puerto 5900
          $ok = $false
          for ($i = 0; $i -lt 20 -and -not $ok; $i++) {
            try { $c = New-Object Net.Sockets.TcpClient('127.0.0.1', 5900); $c.Close(); $ok = $true } catch { Start-Sleep -Seconds 3 }
          }
          if (-not $ok) {
            Get-Service | Where-Object { $_.Name -like '*vnc*' } | Format-Table -AutoSize
            Get-NetTCPConnection -State Listen | Sort-Object LocalPort | Format-Table LocalAddress, LocalPort -AutoSize
            throw "TightVNC no escucha en el puerto 5900 (no se instalo o no arranco)"
          }
          Write-Host "TightVNC escuchando en el puerto 5900"

          # Por defecto TightVNC rechaza las conexiones desde 127.0.0.1 (desde donde conecta websockify)
          foreach ($reg in @('HKLM:\SOFTWARE\TightVNC\Server', 'HKLM:\SOFTWARE\WOW6432Node\TightVNC\Server')) {
            if (-not (Test-Path $reg)) { New-Item -Path $reg -Force | Out-Null }
            New-ItemProperty -Path $reg -Name AllowLoopback -Value 1 -PropertyType DWord -Force | Out-Null
            New-ItemProperty -Path $reg -Name LoopbackOnly -Value 0 -PropertyType DWord -Force | Out-Null
          }
          foreach ($s in (Get-Service | Where-Object { $_.Name -like '*vnc*' })) { Restart-Service $s.Name -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 6

      - name: Abrir Windows en el navegador (noVNC + túnel)
        if: inputs.mode != 'anydesk'
        shell: pwsh
        env:
          MINUTES: ${{ inputs.minutes }}
          VNC_PASS: ${{ steps.vnc.outputs.pass }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $m = 60
          if ($env:MINUTES -match '^\d+$') { $m = [int]$env:MINUTES }
          if ($m -gt 120) { $m = 120 }
          if ($m -lt 1) { $m = 1 }

          python -m pip install --quiet websockify
          Invoke-WebRequest -Uri https://github.com/novnc/noVNC/archive/refs/tags/v1.5.0.zip -OutFile novnc.zip
          Expand-Archive novnc.zip -DestinationPath .
          Start-Process python -ArgumentList '-m','websockify','--web','noVNC-1.5.0','6080','127.0.0.1:5900' -RedirectStandardError ws.log -WindowStyle Hidden

          # Comprobar que websockify sirve noVNC y que el servidor VNC contesta con su saludo RFB
          $web = $false
          for ($i = 0; $i -lt 15 -and -not $web; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-WebRequest -Uri http://127.0.0.1:6080/vnc.html -UseBasicParsing -TimeoutSec 5; if ($r.StatusCode -eq 200) { $web = $true } } catch { }
          }
          if (-not $web) { Get-Content ws.log -ErrorAction SilentlyContinue; throw "noVNC/websockify no responde en el puerto 6080" }
          $c = New-Object Net.Sockets.TcpClient('127.0.0.1', 5900)
          $buf = New-Object byte[] 12
          $c.ReceiveTimeout = 5000
          $n = 0
          try { $n = $c.GetStream().Read($buf, 0, 12) } catch { }
          $c.Close()
          $banner = [Text.Encoding]::ASCII.GetString($buf, 0, $n).Trim()
          Write-Host ('Saludo del servidor VNC: ' + $banner)
          if (-not $banner.StartsWith('RFB')) { throw "El servidor VNC no contesta: esta rechazando las conexiones locales" }

          Invoke-WebRequest -Uri https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe -OutFile cloudflared.exe
          Start-Process .\cloudflared.exe -ArgumentList 'tunnel','--url','http://localhost:6080','--no-autoupdate','--protocol','http2' -RedirectStandardError cf.log -WindowStyle Hidden

          $url = $null
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 3
            $txt = Get-Content cf.log -Raw -ErrorAction SilentlyContinue
            if ($txt -match 'https://[a-z0-9-]+\.trycloudflare\.com') { $url = $Matches[0]; break }
          }
          if (-not $url) { Get-Content cf.log -ErrorAction SilentlyContinue; throw "No se pudo abrir el tunel" }

          # La URL aparece en el log antes de que el tunel funcione: esperar a que este registrado y responda
          $ready = $false
          for ($i = 0; $i -lt 30 -and -not $ready; $i++) {
            Start-Sleep -Seconds 3
            $txt = Get-Content cf.log -Raw -ErrorAction SilentlyContinue
            if ($txt -match 'Registered tunnel connection') {
              try { $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 10; if ($r.StatusCode -eq 200) { $ready = $true } } catch { }
            }
          }
          if (-not $ready) { Write-Host "AVISO: el tunel todavia no responde"; Get-Content cf.log -ErrorAction SilentlyContinue }

          Write-Host "::notice title=WINDOWS::WINDOWS_URL=$url PASS=$($env:VNC_PASS)"
          $json = @{ type = 'vnc'; url = $url; pass = $env:VNC_PASS } | ConvertTo-Json -Compress
          $body = @{ message = 'sesion'; content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($json)) } | ConvertTo-Json
          Invoke-RestMethod -Method Put -Uri ('https://api.github.com/repos/' + $env:GITHUB_REPOSITORY + '/contents/session-' + $env:GITHUB_RUN_ID + '.json') -Headers @{ Authorization = ('Bearer ' + $env:GH_TOKEN); Accept = 'application/vnd.github+json' } -Body $body -ContentType 'application/json' | Out-Null
          Write-Host "Windows abierto durante $m minutos: $url (contrasena VNC: $($env:VNC_PASS))"
          Start-Sleep -Seconds ($m * 60)
